[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
# CI blocks only on real errors: syntax (E9) and pyflakes logic checks —
# undefined names, broken f-strings, redefinitions. Style nits don't block deploys.
select = ["E9", "F63", "F7", "F82"]
